<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cascadia Line Lab</title>
  <meta name="description" content="Personal sports betting dashboard: line shopping, +EV detection, prop hit rates, weather & situational factors, and a bet logbook — NBA, NFL, MLB, NHL." />
  <meta name="theme-color" content="#0b1412" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230f1a17'/%3E%3Cpath d='M8 46 24 22l7 9 6-7 19 22Z' fill='%23e9a86a'/%3E%3Cpath d='M24 22l-4 6 4-1 3 3Z' fill='%23fff' opacity='.85'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="app">
    <aside class="side" id="side">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="bm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c08b"/><stop offset="1" stop-color="#d9622b"/></linearGradient></defs>
          <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/>
          <path d="M6 46 24 20l7 9 6-7 21 24Z" fill="url(#bm)"/>
          <path d="M24 20l-5 7 5-1.5 3 3.5Z" fill="#fff" opacity=".9"/>
          <path d="M10 50l4-9 4 9Zm8 0 3-7 3 7Zm24 0 4-10 4 10Zm8 0 3-6 3 6Z" fill="#22a07c"/>
        </svg>
        <span><b>Cascadia</b><small>Line Lab</small></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-r="home"><svg viewBox="0 0 24 24"><path d="M2 20 9 8l4 6 3-4 6 10Z"/></svg>Basecamp</a>
        <a href="#/lines" data-r="lines"><svg viewBox="0 0 24 24"><circle cx="7" cy="15" r="4"/><circle cx="17" cy="15" r="4"/><path d="M7 11V6h3l1 5m2 0 1-5h3v5"/></svg>Line Shop</a>
        <a href="#/props" data-r="props"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4 19a1.5 1.5 0 0 0 1.3 2h13.4A1.5 1.5 0 0 0 20 19l-6-10V3"/><path d="M7 15h10"/></svg>Prop Lab</a>
        <a href="#/conditions" data-r="conditions"><svg viewBox="0 0 24 24"><path d="M7 17a4 4 0 1 1 .8-7.9A5.5 5.5 0 0 1 18.5 11 3 3 0 0 1 18 17Z"/><path d="M8 20l-1 2m5-2-1 2m5-2-1 2"/></svg>Conditions</a>
        <a href="#/logbook" data-r="logbook"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>Logbook</a>
        <a href="#/accounts" data-r="accounts"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Accounts</a>
        <a href="#/guide" data-r="guide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></svg>Field Guide</a>
        <a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</a>
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="main">
      <header class="top">
        <button class="icon-btn menu" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="top-title">
          <h1 id="pageTitle">Basecamp</h1>
          <div class="top-sub" id="topSub"></div>
        </div>
        <div class="chips" id="sportChips" role="tablist" aria-label="Sport filter"></div>
        <div class="top-actions">
          <button class="icon-btn" id="refreshBtn" aria-label="Refresh odds" data-tip="Refresh odds"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" data-tip="Toggle theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
      <footer class="foot">
        <span>For entertainment and research. Odds change fast — always confirm the price in the app before placing a bet. Gambling problem? Call or text <b>1-800-GAMBLER</b>.</span>
      </footer>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>

name: Refresh NFL matchup data

# Rebuilds data/nfl-matchups.json from nflverse every Tuesday (after Monday Night Football),
# and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-nfl-matchups.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/nfl-matchups.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-matchups.json
          git commit -m "Refresh NFL matchup data"
          git push
